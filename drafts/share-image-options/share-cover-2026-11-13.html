<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<!-- תמונת השיתוף לפי העיצוב החדש (2026-11-13): הקאבר של עמוד הבית, נוגה מימין, הלוגו והתואר על הכחול משמאל.
     צילום: chrome --headless --screenshot --window-size=1200,630 (ראו הערה ב-BaseLayout) -->
<style>
@font-face { font-family: Heebo; src: url('../../node_modules/@fontsource-variable/heebo/files/heebo-hebrew-wght-normal.woff2') format('woff2'); font-weight: 100 900; unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
@font-face { font-family: Heebo; src: url('../../node_modules/@fontsource-variable/heebo/files/heebo-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
:root { --gold-light:#fcdc6d; --gold-dark:#d19a4a; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #01112b; }
.shot { width: 1200px; height: 630px; position: relative; overflow: hidden; font-family: Heebo, sans-serif; color: #fff;
  background: #01112b url('../../src/assets/hero/noga-cover-2026-11-13.webp') right -10px / 1200px auto no-repeat; }
.text { position: absolute; left: 70px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 40px; text-align: center; }
.logo { width: 440px; }
h1 { font-size: 44px; font-weight: 800; line-height: 1.3; white-space: nowrap; }
h1 span { display: block; }
.l1 { background: linear-gradient(90deg, #fff 40%, #cfeaf2); -webkit-background-clip: text; background-clip: text; color: transparent; }
.gold { background: linear-gradient(135deg, var(--gold-light), var(--gold-dark)); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
<div class="shot">
  <div class="text">
    <img class="logo" src="../../public/images/logo-color-on-dark.webp" alt="">
    <h1><span class="l1">יועצת עסקית וארגונית</span><span class="gold">להגדלת הכנסות ושיפור רווחיות</span></h1>
  </div>
</div>
</body>
</html>
