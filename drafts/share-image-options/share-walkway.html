<!doctype html>
<!-- תמונת השיתוף הכללית של האתר (public/images/share-default-3.jpg), 1200×630.
     נוגה בשביל (src/assets/hero/noga-walkway.jpg, צילום אמיתי בלי עריכה), הכחול מכסה את החלונות והבניין כמו בפתיח של הבית.
     צילום מחדש: drafts/share-image-options/shoot-share.py -->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Heebo; src: url('../../node_modules/@fontsource-variable/heebo/files/heebo-hebrew-wght-normal.woff2') format('woff2'); font-weight: 100 900; unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
@font-face { font-family: Heebo; src: url('../../node_modules/@fontsource-variable/heebo/files/heebo-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; }
body { background: #555; padding: 20px; font-family: Heebo, sans-serif; }
.shot { position: relative; overflow: hidden; width: 1200px; height: 630px; background: #0b1a33 url('../../src/assets/hero/noga-walkway.jpg') 0 -20px / 1186px auto no-repeat; }
.shot::after { content: ''; position: absolute; inset: 0;
  background: linear-gradient(to left, #0b1a33 0%, #0b1a33 48%, rgb(11 26 51 / .86) 51%, rgb(11 26 51 / .55) 54%, rgb(11 26 51 / .25) 57.5%, rgb(11 26 51 / .08) 60.5%, rgb(11 26 51 / 0) 63%); }
.txt { position: absolute; z-index: 1; right: 60px; top: 0; bottom: 0; width: 430px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 34px; }
.txt img { width: 380px; }
h1 { font-size: 32px; font-weight: 700; line-height: 1.35; color: #e8eef6; }
h1 span { display: block; }
.gold { background: linear-gradient(135deg, #fcdc6d, #d19a4a); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
<div class="shot">
  <div class="txt">
    <img src="../../public/images/logo-color-on-dark.webp" alt="">
    <h1><span>יועצת עסקית וארגונית</span><span class="gold">להגדלת הכנסות ושיפור רווחיות</span></h1>
  </div>
</div>
</body>
</html>
