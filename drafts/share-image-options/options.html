<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Heebo; src: url('file:///C:/Users/נוגה/Documents/GitHub/website/node_modules/@fontsource-variable/heebo/files/heebo-hebrew-wght-normal.woff2') format('woff2'); font-weight: 100 900; unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
@font-face { font-family: Heebo; src: url('file:///C:/Users/נוגה/Documents/GitHub/website/node_modules/@fontsource-variable/heebo/files/heebo-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
:root { --teal:#199ab5; --gold-light:#fcdc6d; --gold-dark:#d19a4a; --navy:#0b1a33; --navy-deep:#07111f; --on-dark:#e8eef6; --on-dark-soft:#a9b8cc; }
* { box-sizing: border-box; margin: 0; }
body { background: #555; font-family: Heebo, sans-serif; padding: 20px; display: grid; gap: 20px; }
.shot { width: 1200px; height: 630px; position: relative; overflow: hidden; background: var(--navy); color: var(--on-dark); }
.gold { background: linear-gradient(135deg, var(--gold-light), var(--gold-dark)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.glow { position: absolute; border-radius: 50%; filter: blur(90px); }

/* א – במה */
.a .photo { position: absolute; inset: 0 0 0 auto; width: 720px; background: url('file:///C:/Users/נוגה/Documents/GitHub/website/src/assets/hero/stage-noga-3.jpg') 57px -40px / 860px auto no-repeat;
  -webkit-mask-image: linear-gradient(to right, transparent 33%, #000 50%); mask-image: linear-gradient(to right, transparent 33%, #000 50%); }
.a .text { position: absolute; left: 60px; top: 0; bottom: 0; width: 640px; display: flex; flex-direction: column; justify-content: center; gap: 34px; }
.a .logo { width: 430px; }
.a h1 { font-size: 42px; white-space: nowrap; font-weight: 700; line-height: 1.25; }
.a h1 span { display: block; }

/* ב – פנים */
.b { background: radial-gradient(ellipse at 75% 20%, #13284a, var(--navy) 60%); }
.b .photo { position: absolute; inset: 0 auto 0 0; width: 560px; background: url('file:///C:/Users/נוגה/Documents/GitHub/website/src/assets/hero/headshot.webp') 50% 20% / cover;
  -webkit-mask-image: linear-gradient(to right, #000 60%, transparent); mask-image: linear-gradient(to right, #000 60%, transparent); }
.b .text { position: absolute; right: 70px; top: 0; bottom: 0; width: 620px; display: flex; flex-direction: column; justify-content: center; gap: 30px; }
.b .logo { width: 440px; }
.b h1 { font-size: 40px; font-weight: 600; line-height: 1.3; }
.b .line { width: 90px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--gold-light), var(--gold-dark)); }
.b p { font-size: 28px; color: var(--teal); font-weight: 600; filter: brightness(1.35); }

/* ג – מותג */
.c { display: grid; place-items: center; text-align: center; background: radial-gradient(ellipse at 50% 40%, #13284a, var(--navy) 70%); }
.c .inner { position: relative; display: flex; flex-direction: column; align-items: center; gap: 40px; }
.c .logo { width: 600px; }
.c h1 { font-size: 40px; font-weight: 600; line-height: 1.35; }
.c .rule { position: absolute; bottom: 70px; left: 50%; translate: -50% 0; width: 140px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--gold-light), transparent); }
</style>
</head>
<body>

<div class="shot a" data-file="option-a.png">
  <div class="photo"></div>
  <div class="text">
    <img class="logo" src="file:///C:/Users/נוגה/Documents/GitHub/website/public/images/logo-color-on-dark.webp" alt="">
    <h1><span>יועצת עסקית וארגונית</span><span class="gold">להגדלת הכנסות ושיפור רווחיות</span></h1>
  </div>
</div>

<div class="shot b" data-file="option-b.png">
  <div class="glow" style="width:420px;height:420px;right:-120px;bottom:-160px;background:rgb(25 154 181 / .35)"></div>
  <div class="glow" style="width:300px;height:300px;right:380px;top:-160px;background:rgb(252 220 109 / .18)"></div>
  <div class="photo"></div>
  <div class="text">
    <img class="logo" src="file:///C:/Users/נוגה/Documents/GitHub/website/public/images/logo-color-on-dark.webp" alt="">
    <div class="line"></div>
    <h1>יועצת עסקית וארגונית<br><span class="gold">להגדלת הכנסות ושיפור רווחיות</span></h1>
  </div>
</div>

<div class="shot c" data-file="option-c.png">
  <div class="glow" style="width:520px;height:520px;left:-160px;top:-200px;background:rgb(25 154 181 / .35)"></div>
  <div class="glow" style="width:460px;height:460px;right:-140px;bottom:-220px;background:rgb(209 154 74 / .28)"></div>
  <div class="inner">
    <img class="logo" src="file:///C:/Users/נוגה/Documents/GitHub/website/public/images/logo-color-on-dark.webp" alt="">
    <h1>יועצת עסקית וארגונית<br><span class="gold">להגדלת הכנסות ושיפור רווחיות</span></h1>
