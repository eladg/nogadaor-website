# הגדרות האירוח ב-Netlify.
# הפונקציות בתיקייה netlify/functions רצות בשרת (למשל חיבור הטפסים לסמוב).
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# קישור קצר להפצת השאלון (נוגה, 2026-11-19): nogadayanor.com/quiz מוביל לעמוד השאלון.
# פרמטרים בכתובת (למשל ?src=facebook) עוברים הלאה לבד.
# 200 ולא 301 (נוגה, 2026-11-19): העמוד מוגש ישירות בכתובת הקצרה, בלי הפניה, כדי שוואטסאפ יציג את התמונה בתצוגה המקדימה
[[redirects]]
  from = "/quiz"
  to = "/guides/business-focus-quiz/"
  status = 200
